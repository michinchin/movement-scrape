name: Refresh Movement calendar feed
on:
  schedule:
    - cron: "17 12 * * *"   # daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Build feed (rest of this month + all of next)
        run: |
          END=$(date -d "$(date +%Y-%m-01) +2 month -1 day" +%F)
          python movement_to_gcal.py --end "$END" --ics movement.ics
      - name: Publish to gh-pages
        run: |
          mkdir out && cp movement.ics out/
          cd out && git init -q && git checkout -q -b gh-pages
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -qm "update feed"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
