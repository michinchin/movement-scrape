name: Refresh Movement calendar feed
on:
  schedule:
    - cron: "17 12 * * *"   # daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Build feed (rest of this month + all of next)
        run: |
          END=$(date -d "$(date +%Y-%m-01) +2 month -1 day" +%F)
          python movement_to_gcal.py --end "$END" --ics movement.ics
      - name: Commit movement.ics to main
        run: |
          git config user.name github-actions && git config user.email actions@github.com
          git add movement.ics
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "Update movement.ics"
          git pull -q --rebase origin main
          git push origin HEAD:main
